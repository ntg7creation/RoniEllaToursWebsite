# Optional VPS HTTPS edge. Use together with compose.yml after configuring DNS.
services:
  edge:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_HOST: ${SITE_HOST:?Set the hostname served by Caddy}
      TLS_EMAIL: ${TLS_EMAIL:?Set an email for certificate notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
